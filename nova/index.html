<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Grid System Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="container">
        <div class="spacer-left"></div>

        <div class="content">
            <!-- 8x1 Search container -->
            <div class="module module--search col-8 h-1">8×1 Search</div>

            <!-- 4x2 modules -->
            <div class="module col-4 h-2">4×2</div>
            <div class="module col-4 h-2">4×2</div>

            <!-- 2x2 modules -->
            <div class="module col-2 h-2">2×2</div>
            <div class="module col-2 h-2">2×2</div>
            <div class="module col-2 h-2">2×2</div>
            <div class="module col-2 h-2">2×2</div>

            <!-- 1x2 modules -->
            <div class="module col-1 h-2">1×2</div>
            <div class="module col-1 h-2">1×2</div>
            <div class="module col-1 h-2">1×2</div>
            <div class="module col-1 h-2">1×2</div>

            <!-- 4x4 MREC Ad -->
            <div class="module module--ad col-4 h-4">Ad · MREC (4×4)</div>

            <!-- More 4x2 modules -->
            <div class="module col-4 h-2">4×2</div>

            <!-- 1x1 modules -->
            <div class="module col-1 h-1">1×1</div>
            <div class="module col-1 h-1">1×1</div>
            <div class="module col-1 h-1">1×1</div>
            <div class="module col-1 h-1">1×1</div>

            <!-- 12x4 Billboard Ad (will wrap at smaller breakpoints) -->
            <div class="module module--ad col-12 h-4">Ad · Billboard (12×4)</div>
        </div>

        <div class="spacer-right"></div>
    </div>
</body>

</html>
